<section id="join" class="sc-section sc-join">
  <h2>Join Sky City</h2>
  <div class="sc-join-grid">

    <!-- Consumer Section -->
    <div class="sc-join-card">
      <h3>Consumers</h3>
      <p>Create your profile, explore districts, socialize, chat, and leave reviews.</p>

      <!-- Consumer Registration -->
      <button onclick="window.location.href='/auth/register/consumer'">
        Create Consumer Profile
      </button>

     
    </div>

    <!-- Business Section -->
    <div class="sc-join-card">
      <h3>Businesses</h3>
      <p>Build your storefront, list services, upload media, and connect with customers.</p>

      <!-- Business Registration -->
      <button onclick="window.location.href='/auth/register/business'">
        Create Business Profile
      </button>

    
    </div>

  </div>
</section>
